<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container {
            width: 850px;
            min-height: 500px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        /* Welcome Section */
        .welcome {
            width: 50%;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .welcome p {
            font-size: 17px;
            line-height: 1.6;
        }

        /* Login Section */
        .login {
            width: 50%;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 30px;
            color: #333;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #0072ff;
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #0072ff;
            text-decoration: none;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0072ff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0056cc;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 14px;
        }

        .signup a {
            color: #0072ff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Mobile Responsive */
        @media (max-width: 700px) {
            .container {
                width: 90%;
                flex-direction: column;
            }

            .welcome,
            .login {
                width: 100%;
            }

            .welcome {
                padding: 30px;
            }

            .welcome h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Welcome -->
        <div class="welcome">
            <h1>Welcome!</h1>
            <p>
                We're glad to have you here.
                Login to access your account and
                explore our platform.
            </p>
        </div>

        <!-- Login -->
        <div class="login">

            <h2>Login</h2>

            <form>
                <div class="input-box">
                    <label>Email / Username</label>
                    <input type="text" placeholder="Enter your username" required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>
            </form>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </div>

    </div>

</body>
</html>
